name: Nightly Build

on:
  workflow_dispatch: ~
  schedule:
    - cron: '0 0 * * *'

jobs:

  release:
    strategy:
      matrix:
        os: [ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Set GITHUB_ENV variables
        run: |
          echo "REPONAME=$(basename ${{ github.repository }})" >> $GITHUB_ENV
        shell: bash

      - name: Checkout
        uses: actions/checkout@v2

      - name: Build package
        run: make build

      - name: Rename package
        run: mv build.zip ${{ env.REPONAME }}-nightly.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: nightly
          tag_name: nightly
          prerelease: true
          body: Nightly release generated from `main` at 12 AM UTC.
          files: ${{ env.REPONAME }}-nightly.zip
